<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>☦️CATEHISM ORTODOX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080808">
<!-- Am adaugat fontul Cinzel pentru titluri/butoane si greutati mai vizibile pentru Cormorant Garamond -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

<style>
    *{
    box-sizing:border-box;
}
html, body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Cormorant Garamond', serif;
    background-image:url("PEISAJ.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#fff1d0; /* Nuanță mai luminoasă de auriu pentru lizibilitate maximă */
    height:100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
.overlay{
    min-height:100vh;
    background:rgba(8,8,8,0.84);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    position: relative;
    z-index: 10;
}
    .card{
    max-width:900px;
    width:100%;
    background:rgba(18,14,10,0.92);
    border-radius:18px;
    padding:20px;
    box-shadow:0 0 40px rgba(0,0,0,0.85);
    margin-top:170px;

    display:flex;
    flex-direction:column;

    height:calc(100vh - 190px);
}
.page-indicator{
    text-align:center;
    margin-top:12px;
    font-size:18px;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    color: #e6c587;
    opacity:0.6;
    flex-shrink:0;
    letter-spacing: 1px;
}

#bookmark{
    position:fixed;
    right:12px;
    bottom:80px;
    width:32px;
    height:32px;
    border-radius:50%;
    background:rgba(18,14,10,0.85);
    border:1px solid #c9a24d;
    color:#f2e6c9;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    opacity:0.75;
}

#bookmark:hover{
    opacity:1;
}


#bookmarkMessage{
    position:fixed;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(18,14,10,0.95);
    border:1px solid #c9a24d;
    color:#f2e6c9;
    padding:8px 15px;
    border-radius:10px;
    font-size:16px;
    font-family: 'Cinzel', serif;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s;
    z-index:100;
}
    
/* BARA DE PROGRES SI BULINE */
.lesson-progress-bar {
    width: 100%;
    margin-bottom: 12px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    position: relative;
    flex-shrink: 0;
}
.progress-line-track {
    position: absolute;
    top: 50%;
    left: 15px;
    right: 15px;
    height: 3px;
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-50%);
    z-index: 1;
    transition: all 0.4s ease;
}
.progress-dots-container {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
}
.dot {
    border-radius: 50%;
    background: #1a140e;
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    cursor: pointer;
}
.dot.small {
    width: 8px;
    height: 8px;
    opacity: 0.6;
}
.dot.large {
    width: 15px;
    height: 15px;
    border-width: 2px;
}

/* STILURI REGALE IN FUNCTIE DE CATEGORIE */

/* CREDINTA - ROSU REGAL */
.theme-credinta .progress-line-track {
    background: rgba(231, 76, 60, 0.35);
    box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
}
.theme-credinta .dot {
    border-color: #e74c3c;
}
.theme-credinta .dot.large {
    box-shadow: 0 0 6px rgba(231, 76, 60, 0.6);
}
.theme-credinta .dot.active {
    background: #ff5252;
    border-color: #ffffff;
    box-shadow: 0 0 14px rgba(231, 76, 60, 1), 0 0 6px rgba(255, 255, 255, 0.8);
    transform: scale(1.35);
    opacity: 1;
}

/* NADEJDEA - GALBEN REGAL */
.theme-nadejdea .progress-line-track {
    background: rgba(241, 196, 15, 0.35);
    box-shadow: 0 0 8px rgba(241, 196, 15, 0.5);
}
.theme-nadejdea .dot {
    border-color: #f1c40f;
}
.theme-nadejdea .dot.large {
    box-shadow: 0 0 6px rgba(241, 196, 15, 0.6);
}
.theme-nadejdea .dot.active {
    background: #ffeb3b;
    border-color: #ffffff;
    box-shadow: 0 0 14px rgba(241, 196, 15, 1), 0 0 6px rgba(255, 255, 255, 0.8);
    transform: scale(1.35);
    opacity: 1;
}

/* DRAGOSTEA - ALBASTRU REGAL */
.theme-dragostea .progress-line-track {
    background: rgba(52, 152, 219, 0.35);
    box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
}
.theme-dragostea .dot {
    border-color: #3498db;
}
.theme-dragostea .dot.large {
    box-shadow: 0 0 6px rgba(52, 152, 219, 0.6);
}
.theme-dragostea .dot.active {
    background: #00d2ff;
    border-color: #ffffff;
    box-shadow: 0 0 14px rgba(52, 152, 219, 1), 0 0 6px rgba(255, 255, 255, 0.8);
    transform: scale(1.35);
    opacity: 1;
}

    .question{
font-size:18px !important;
line-height:1.5 !important;
font-weight:700; /* Font îngroșat pentru un plus de claritate */
font-family: 'Cormorant Garamond', serif;
letter-spacing: 0.3px;
color: #ffffff;
text-shadow: 0 1px 3px rgba(0,0,0,0.8);
padding:18px;
border-radius:12px;
background:rgba(255,215,140,0.1);
border: 1px solid rgba(201, 162, 77, 0.2);

max-height:35%;
overflow-y:auto;
flex-shrink:0;
}

    .answer{
flex:1;
overflow-y:auto;
overflow-x:hidden;
padding-top:15px;
padding-bottom:25px;
font-size:20px;
line-height:1.65;
font-weight: 500; /* Greutate medie pentru o lectură fără efort */
color: #fff2d6;
text-shadow: 0 1px 2px rgba(0,0,0,0.6);
letter-spacing: 0.2px;
}
    
/* NAV */
.nav-text{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    font-size:24px;
    opacity:0.65;
    user-select:none;
    flex-shrink:0;
}
.nav-text span{ cursor:pointer; }
.nav-text span:hover{ opacity:1; }

/* WIDGETE */
.widget{
    position:fixed;
    background:rgba(18,14,10,0.95);
    border:1px solid #c9a24d;
    border-radius:12px;
    padding:8px;
    font-size:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.7);
}
#pomodoro{ top:10px; left:10px; display:flex; align-items:center; gap:5px; z-index:20; }
#pomodoroTime{ font-size:20px; font-weight:bold; font-family: 'Cinzel', serif; min-width:50px; text-align:center; color:#f5deb3; }
#pomodoro button{
    padding:3px 6px;
    font-size:11px;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    border-radius:6px;
    border:1px solid #b89b55;
    background:linear-gradient(180deg,#4a3820,#2e2314);
    color:#f2e6c9;
    cursor:pointer;
}
#pomodoro button:hover{
    background:linear-gradient(180deg,#5a4528,#3a2c18);
}

/* CLOPOTE */
#bells{
    top:10px;
    right:10px;
    width:50px;
    height:50px;
    padding:0;
    cursor:pointer;
    border-radius:10px;
    border:1px solid #c9a24d;
    z-index:20;
}
#bells img{ width:100%; height:100%; border-radius:10px; }

/* CRUCE */
#overlayImage{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
}
#overlayImage img{
    width:120px;
    opacity:0.88;
    border-radius:20px;
}

/* BUTOANE CATEGORII */
#overlayButtons{
    position:absolute;
    top:150px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:5px;
    z-index:1000;
}
#overlayButtons button{
    padding:4px 10px;
    font-size:11px;
    font-family: 'Cinzel', serif;
    font-weight:bold;
    letter-spacing: 1px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    opacity:0.4;
}
#overlayButtons button.active{
    opacity:1;
    box-shadow:0 0 10px rgba(255,215,140,0.8);
}
.btn-dragostea{background:#3498db;color:#fff;}
.btn-nadejdea{background:#f1c40f;color:#000;}
.btn-credinta{background:#e74c3c;color:#fff;}
    @media (max-width:768px){

    .question{
        font-size:24px;
        line-height:1.4;
        flex-shrink:0;
    }

    .answer{
        font-size:24px;
        line-height:1.55;
    }

}
</style>
</head>

<body>
<div id="overlayImage">
    <img src="Sf Cruce.PNG" alt="Sf. Cruce" style="height:120px; width:auto;">
</div>

<div id="overlayImage">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN4AAAEPCAYAAAAtcnqJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAP+lSURBVHhe7P1nmFxXdiWIJpDe+8zIzPDeex/pDRI24T1Bb0GQhCUJEARIgCBhCE" alt="Sf. Cruce">
</div>

<div id="overlayButtons">
    <button class="btn-dragostea">DRAGOSTEA</button>
    <button class="btn-nadejdea">NĂDEJDEA</button>
    <button class="btn-credinta active">CREDINȚA</button>
</div>



<div class="widget" id="bells">
    <img src="clopote.jpg" alt="Clopot">
</div>
    
<audio id="bellsAudio" preload="auto">
    <source src="toacasiclopote.mp3" type="audio/mpeg">
</audio>

    <div id="bookmark" onclick="setBookmark()">🔖</div>
<div id="bookmarkMessage"></div>
    
<div class="overlay">

<div class="card">

<!-- BARA DE PROGRES SI BULINE -->
<div class="lesson-progress-bar" id="progressBar">
    <div class="progress-line-track"></div>
    <div class="progress-dots-container" id="progressDotsContainer"></div>
</div>

<div class="question" id="question"></div>
<div class="answer" id="answer"></div>

<div class="nav-text">
    <span onclick="prevPage()">◀</span>
    <span onclick="nextPage()">▶</span>
</div>

<div class="page-indicator" id="pageIndicator"></div>

</div>
</div>

<script>

    const audio = document.getElementById("bellsAudio");
let bellsPlaying = false;

document.getElementById("bells").onclick = () => {

    if (!bellsPlaying) {

        audio.play();
        bellsPlaying = true;

    } else {

        audio.pause();
        bellsPlaying = false;

    }

};

audio.onended = () => {
    bellsPlaying = false;
};

const categories = [
    {start:0,end:111,btn:".btn-credinta", class:"theme-credinta"},
    {start:112,end:146,btn:".btn-nadejdea", class:"theme-nadejdea"},
    {start:147,end:211,btn:".btn-dragostea", class:"theme-dragostea"}
];

let catIndex=0, current=0;
const q=document.getElementById("question");
const a=document.getElementById("answer");
const p=document.getElementById("pageIndicator");
let answerVisible=false;
let catehismData=[];

function updateProgressBar() {
    const progressBar = document.getElementById("progressBar");
    const dotsContainer = document.getElementById("progressDotsContainer");
    if(!dotsContainer || !progressBar) return;

    // Aplicare tema de culoare specifice categoriei
    progressBar.className = "lesson-progress-bar " + categories[catIndex].class;
    dotsContainer.innerHTML = "";
    
    const cat = categories[catIndex];
    const total = cat.end - cat.start + 1;
    const currentRel = current - cat.start;
    
    const numDots = 15;
    
    for(let i = 0; i < numDots; i++) {
        const dot = document.createElement("div");
        
        const isMajor = (i === 0 || i === Math.floor(numDots / 2) || i === numDots - 1);
        
        dot.className = "dot " + (isMajor ? "large" : "small");
        
        const dotProgressRatio = i / (numDots - 1);
        const currentProgressRatio = total > 1 ? (currentRel / (total - 1)) : 0;
        
        if (Math.abs(dotProgressRatio - currentProgressRatio) < (1 / numDots)) {
            dot.classList.add("active");
        }
        
        dot.onclick = () => {
            current = cat.start + Math.round(dotProgressRatio * (total - 1));
            load();
        };
        
        dotsContainer.appendChild(dot);
    }
}

function key(i){return "pagina_"+i;}
function activateCategory(i){
    catIndex=i;
    const c=categories[i];
    document.querySelectorAll("#overlayButtons button").forEach(b=>b.classList.remove("active"));
    document.querySelector(c.btn).classList.add("active");
    current=c.start;
    load();
}
function load(){
 const c=categories[catIndex];
 if(!catehismData[current]) return;
console.log("INDEX:", current);
console.log("INTREBARE:", catehismData[current].q);
    
 q.innerText=catehismData[current].q;
 a.innerText=catehismData[current].a;
 answerVisible=true;
 showAnswer();
 p.innerText=`${current+1} / 212`;
 updateProgressBar();
}

    function save(){
    localStorage.setItem("ultimaPagina", current);
    localStorage.setItem("ultimaCategorie", catIndex);
}


function setBookmark(){

    save();

    const msg=document.getElementById("bookmarkMessage");

    msg.innerText="🔖 Semn de carte salvat — Pagina " + (current+1);
    msg.style.opacity=1;

    setTimeout(()=>{
        msg.style.opacity=0;
    },2000);
}



function nextPage(){

    save();

    if(current < categories[catIndex].end){

        current++;
        load();

    } else if(catIndex < categories.length-1){

        activateCategory(catIndex+1);

    }

}
function prevPage(){

    save();

    if(current > categories[catIndex].start){

        current--;
        load();

    } else if(catIndex > 0){

        activateCategory(catIndex-1);
        current=categories[catIndex].end;
        load();

    }

}

function showAnswer(){

    a.style.display="block";
    a.style.opacity=1;
    a.scrollTop=0;
    answerVisible=true;
}


document.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight") nextPage();
    if(e.key==="ArrowLeft") prevPage();
   });



fetch("catehism.json")
.then(r=>r.json())
.then(data=>{

    catehismData=data.map(x=>({
        q:x.q,
        a:x.a
    }));

    categories[2].end=211;

    console.log(catehismData.length);
    console.log(catehismData[0]);
    let savedPage = localStorage.getItem("ultimaPagina");
let savedCat = localStorage.getItem("ultimaCategorie");

if(savedPage !== null && savedCat !== null){

    catIndex = Number(savedCat);
    current = Number(savedPage);

    document.querySelectorAll("#overlayButtons button")
    .forEach(b=>b.classList.remove("active"));

    document.querySelector(categories[catIndex].btn)
    .classList.add("active");

    load();

}else{

    activateCategory(0);

}

})
.catch(e=>{
    q.innerText="Eroare JSON";
    a.innerText=String(e);

});


document.querySelector(".btn-credinta").onclick=()=>activateCategory(0);
document.querySelector(".btn-nadejdea").onclick=()=>activateCategory(1);
document.querySelector(".btn-dragostea").onclick=()=>activateCategory(2);

let interval=null, time=1500, running=false, isWork=true;
const timerDiv=document.getElementById("pomodoroTime");
function updateTime(){timerDiv.innerText=String(Math.floor(time/60)).padStart(2,'0')+":"+String(time%60).padStart(2,'0');}
function startPomodoro(){if(running) return; running=true; interval=setInterval(()=>{time--; updateTime(); if(time<=0){clearInterval(interval); if(isWork){isWork=false; time=300;} else {isWork=true; time=1500;} updateTime(); running=false; startPomodoro();}},1000);}
function pausePomodoro(){if(running){running=false; clearInterval(interval);}}
function stopPomodoro(){pausePomodoro(); isWork=true; time=1500; updateTime();}
updateTime();
</script>

    <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
