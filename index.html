<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>☦️ Catehism Ortodox</title>
<style>
body{margin:0;font-family:Georgia,serif;background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80') center/cover fixed;color:#f5e8c8}
.overlay{background:rgba(0,0,0,.72);min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{width:min(900px,92%);background:rgba(25,20,15,.92);padding:24px;border-radius:18px;box-shadow:0 0 30px #000}
h1{text-align:center}
#question{font-size:28px;font-weight:bold;cursor:pointer}
#answer{margin-top:18px;font-size:21px;display:none;line-height:1.6}
.nav{display:flex;justify-content:space-between;margin-top:24px}
button{padding:10px 18px;font-size:18px;border-radius:10px;cursor:pointer}
#info{text-align:center;margin-top:10px;opacity:.8}
</style>
</head>
<body>
<div class="overlay">
<div class="card">
<h1>☦️ Catehism Ortodox</h1>
<div id="question">Se încarcă...</div>
<div id="answer"></div>
<div class="nav">
<button onclick="prev()">◀ Anterioară</button>
<button onclick="next()">Următoarea ▶</button>
</div>
<div id="info"></div>
</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxl7ksSYe3YZ_5ijkoDp94ugCEGNcRYZ0Tz69tNF3PCbbx7UCC4JsVlWhXYUDp472fy/exec";
let data=[],i=0,shown=false;
const q=document.getElementById("question");
const a=document.getElementById("answer");
const info=document.getElementById("info");
async function loadData(){
 try{
   const r=await fetch(API);
   data=await r.json();
   show();
 }catch(e){
   q.textContent="Nu s-au putut încărca datele.";
 }
}
function show(){
 if(!data.length)return;
 q.textContent=data[i].q;
 a.textContent=data[i].a;
 a.style.display=shown?"block":"none";
 info.textContent=`Întrebarea ${i+1} din ${data.length}`;
}
q.onclick=()=>{shown=!shown;show();}
function next(){if(i<data.length-1){i++;shown=false;show();}}
function prev(){if(i>0){i--;shown=false;show();}}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")next();
 if(e.key==="ArrowLeft")prev();
 if(e.key==="ArrowDown"){shown=true;show();}
 if(e.key==="ArrowUp"){shown=false;show();}
});
loadData();
</script>
</body>
</html>
